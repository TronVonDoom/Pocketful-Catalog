# Prices every published printing from TCGplayer, nightly, and publishes the result beside the
# catalog on Cloudflare R2: prices/prices.json.gz and one prices/history/<set>.json.gz per set.
# See tools/publish_prices.py and docs/database.md.
#
# One client asks so that every installed copy of the app does not have to, which is also what
# TCGCSV's terms ask for: a pull a day, ingested rather than queried live. Only printings that
# have been published and linked to a TCGplayer product in the editor are priced.
#
# Nothing is committed. Credentials are repository secrets: the Supabase project URL and secret
# key (read-only use: the job only reads links), and the R2 endpoint and token.
name: Prices

on:
  schedule:
    # 21:00 UTC. TCGCSV rebuilds around 20:00, so this runs after today's figures exist.
    - cron: '0 21 * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Also rebuild price history from TCGCSV archives back to February 2024 (slow)'
        type: boolean
        default: false

permissions:
  contents: read

# A second run starting while the first is still fetching would double the load on the service
# this job exists to be gentle with.
concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POCKETFUL_SUPABASE_URL: ${{ secrets.POCKETFUL_SUPABASE_URL }}
      POCKETFUL_SUPABASE_SECRET_KEY: ${{ secrets.POCKETFUL_SUPABASE_SECRET_KEY }}
      POCKETFUL_R2_ENDPOINT: ${{ secrets.POCKETFUL_R2_ENDPOINT }}
      POCKETFUL_R2_ACCESS_KEY_ID: ${{ secrets.POCKETFUL_R2_ACCESS_KEY_ID }}
      POCKETFUL_R2_SECRET_ACCESS_KEY: ${{ secrets.POCKETFUL_R2_SECRET_ACCESS_KEY }}
      POCKETFUL_R2_PUBLIC_BUCKET: ${{ secrets.POCKETFUL_R2_PUBLIC_BUCKET }}
      POCKETFUL_R2_PUBLIC_URL: ${{ secrets.POCKETFUL_R2_PUBLIC_URL }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # TCGCSV's product lists change rarely, so they are kept between runs; tools/tcgcsv.py
      # asks again only for what is older than its time-to-live.
      - name: Restore the TCGCSV cache
        uses: actions/cache@v4
        with:
          path: catalog/.tcgcsv/v2
          key: tcgcsv-${{ github.run_id }}
          restore-keys: tcgcsv-

      - name: Tools for the backfill
        if: github.event_name == 'workflow_dispatch' && inputs.backfill
        run: |
          sudo apt-get install -y p7zip-full >/dev/null
          pip install requests

      - name: Publish prices
        run: python tools/publish_prices.py ${{ (github.event_name == 'workflow_dispatch' && inputs.backfill) && '--backfill' || '' }}
