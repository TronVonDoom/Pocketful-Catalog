# Refreshes market prices and republishes them, nightly.
#
# This is the job that justifies the whole repository. Before it, every installed copy
# of Pocketful asked TCGdex for one card document per card in the collection, on a
# six-hour TTL -- so a thousand users with five-hundred-card collections was roughly
# seventeen requests a second against a free API with no caching in front of it.
#
# Now one client asks, once a day, with a User-Agent and a backoff, and every user
# downloads a single file. Above about one user that is the polite arrangement, not the
# greedy one.
#
# Prices are never committed. They change every night, nobody reviews a diff of
# twenty-three thousand numbers, and the tree is not how the app reads them anyway.
name: Prices

on:
  schedule:
    # 07:00 UTC, which is the small hours in North America -- the app's users are asleep
    # and TCGdex's daytime traffic has not started.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

# A second run starting while the first is still fetching would double the load on the
# API this job exists to be gentle with.
concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # One request per card, ~23,500 cards, six at a time. Comfortably under the six-hour
    # ceiling, but not so comfortably that the default of 360 is worth relying on.
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: Pull prices
        run: python tools/pull_catalog.py --prices --all

      - name: Pack
        run: python tools/pack.py --prices

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A fixed tag, updated in place, rather than a dated release per night. The app
        # needs one URL that always means "the current prices"; a new tag every night
        # would mean the app had to search for the newest one before it could download
        # anything, and would leave three hundred and sixty-five dead releases a year.
        run: |
          gh release view prices --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create prices \
                 --repo "$GITHUB_REPOSITORY" \
                 --title "Market prices" \
                 --notes "TCGplayer market quotes, refreshed nightly. Replaced in place; see the asset's timestamp for freshness."
          gh release upload prices dist/prices-v1.json.gz \
            --repo "$GITHUB_REPOSITORY" --clobber
