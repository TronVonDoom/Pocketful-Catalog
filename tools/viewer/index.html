<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog Viewer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115; --panel: #161922; --panel2: #1c2029; --line: #272c38;
    --ink: #e6e9ef; --ink2: #9aa3b2; --ink3: #6b7482;
    --accent: #6ea8fe; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --alt: #c084fc;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    height: 100vh; display: grid; grid-template-rows: auto 1fr; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  header .stats { color: var(--ink2); font-variant-numeric: tabular-nums; }
  header .spacer { flex: 1; }
  input[type=search], select {
    background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; font: inherit; min-width: 200px;
  }
  label.toggle { display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); cursor: pointer; user-select: none; }

  main { display: grid; grid-template-columns: 280px 1fr; min-height: 0; }

  aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  .serie { border-bottom: 1px solid var(--line); }
  .serie > button {
    width: 100%; text-align: left; background: none; border: 0; color: var(--ink);
    padding: 9px 12px; font: inherit; cursor: pointer; display: flex; gap: 8px; align-items: baseline;
  }
  .serie > button:hover { background: var(--panel2); }
  .serie .name { font-weight: 600; }
  .serie .meta { color: var(--ink3); font-size: 11px; margin-left: auto; font-variant-numeric: tabular-nums; }
  .sets { display: none; padding-bottom: 4px; }
  .serie.open .sets { display: block; }
  .sets button {
    width: 100%; text-align: left; background: none; border: 0; color: var(--ink2);
    padding: 5px 12px 5px 24px; font: inherit; cursor: pointer;
    display: flex; gap: 8px; align-items: baseline;
  }
  .sets button:hover { background: var(--panel2); color: var(--ink); }
  .sets button.active { background: var(--accent); color: #08121f; font-weight: 600; }
  .sets .id { font-size: 11px; opacity: .6; margin-left: auto; font-variant-numeric: tabular-nums; }

  section { overflow-y: auto; padding: 16px; min-width: 0; }
  .sethead { display: flex; gap: 14px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .sethead img { height: 46px; max-width: 180px; object-fit: contain; }
  .sethead h2 { margin: 0; font-size: 17px; }
  .sethead .sub { color: var(--ink2); }

  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
  .badge {
    border-radius: 999px; padding: 3px 9px; font-size: 11px; font-weight: 600;
    background: var(--panel2); color: var(--ink2); border: 1px solid var(--line);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .badge.ok   { color: var(--ok);   border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
  .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, transparent); }
  .badge.bad  { color: var(--bad);  border-color: color-mix(in srgb, var(--bad) 35%, transparent); }
  .badge.alt  { color: var(--alt);  border-color: color-mix(in srgb, var(--alt) 35%, transparent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 12px; }
  .card { cursor: pointer; border-radius: var(--radius); overflow: hidden; background: var(--panel); border: 1px solid var(--line); }
  .card:hover { border-color: var(--accent); }
  .thumb { aspect-ratio: 245 / 342; background: var(--panel2); display: grid; place-items: center; position: relative; }
  .thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .thumb .none {
    color: var(--ink3); font-size: 11px; text-align: center; padding: 8px; line-height: 1.35;
  }
  .thumb .flag {
    position: absolute; top: 5px; right: 5px; font-size: 10px; font-weight: 700;
    padding: 2px 6px; border-radius: 999px; background: #000a; backdrop-filter: blur(4px);
  }
  .flag.alt { color: var(--alt); }
  .flag.bad { color: var(--bad); }
  .cap { padding: 6px 8px; font-size: 11px; }
  .cap .n { color: var(--ink3); font-variant-numeric: tabular-nums; }
  .cap .t { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  dialog {
    background: var(--panel); color: var(--ink); border: 1px solid var(--line);
    border-radius: 14px; padding: 0; max-width: min(920px, 94vw); width: 100%;
  }
  dialog::backdrop { background: #000b; }
  .dlg { display: grid; grid-template-columns: 260px 1fr; gap: 0; max-height: 82vh; }
  .dlg .art { padding: 16px; border-right: 1px solid var(--line); background: var(--panel2); }
  .dlg .art img { width: 100%; border-radius: 8px; }
  .dlg .body { padding: 16px; overflow-y: auto; min-width: 0; }
  .dlg h3 { margin: 0 0 2px; font-size: 16px; }
  .dlg .sub { color: var(--ink2); margin-bottom: 12px; }
  pre {
    background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px; overflow-x: auto; font-size: 11.5px; line-height: 1.5; margin: 0;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  .dlg .close { position: absolute; top: 10px; right: 14px; background: none; border: 0; color: var(--ink2); font-size: 22px; cursor: pointer; }
  .links a { color: var(--accent); font-size: 11.5px; word-break: break-all; }
  .empty { color: var(--ink3); padding: 40px; text-align: center; }
  @media (max-width: 860px) {
    main { grid-template-columns: 1fr; }
    aside { display: none; }
    .dlg { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1>Catalog Viewer</h1>
  <span class="stats" id="globalStats">loading…</span>
  <span class="spacer"></span>
  <input type="search" id="q" placeholder="filter cards by name or number">
  <label class="toggle"><input type="checkbox" id="holesOnly"> holes only</label>
  <button id="reload" style="background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer">Reload</button>
</header>

<main>
  <aside id="nav"></aside>
  <section id="view"><div class="empty">Pick a set on the left.</div></section>
</main>

<dialog id="dlg"><button class="close" id="dlgClose">×</button><div class="dlg" id="dlgBody"></div></dialog>

<script>
const $ = (s) => document.querySelector(s);
const state = { index: null, sets: new Map(), current: null, cache: new Map() };

// The catalog is served from the repo root, so these are the same paths the tools write.
const INDEX = '../../catalog/index.json';
const SET = (id) => `../../catalog/sets/${encodeURIComponent(id)}.json`;

// TCGdex serves every rendition off one stem; the caller appends a quality and format.
// Matches app/pocketful/data/CardArt.kt so the viewer shows what the app would show.
const thumb = (stem) => stem ? `${stem}/low.webp` : null;
const full  = (stem) => stem ? `${stem}/high.png` : null;
const logo  = (stem) => stem ? `${stem}.png` : null;

async function boot() {
  try {
    state.index = await (await fetch(INDEX, { cache: 'no-store' })).json();
  } catch (e) {
    $('#nav').innerHTML = `<div class="empty">Could not read catalog/index.json.<br><br>
      Run <code>python tools/serve.py</code> from the repo root.</div>`;
    return;
  }
  renderNav();
  $('#globalStats').textContent = `${state.index.sets.length} sets indexed · pulled ${state.index.fetchedAt ?? '—'}`;
}

function renderNav() {
  const bySerie = new Map();
  for (const s of state.index.sets) {
    const k = s.serie?.id ?? '—';
    if (!bySerie.has(k)) bySerie.set(k, { name: s.serie?.name ?? k, sets: [] });
    bySerie.get(k).sets.push(s);
  }
  // Newest era first, matching the app's default. Within an era, newest set first.
  const groups = [...bySerie.entries()].sort((a, b) => {
    const ad = Math.max(...a[1].sets.map(s => Date.parse(s.releaseDate || 0) || 0));
    const bd = Math.max(...b[1].sets.map(s => Date.parse(s.releaseDate || 0) || 0));
    return bd - ad;
  });

  $('#nav').innerHTML = groups.map(([id, g]) => {
    const sets = [...g.sets].sort((a, b) => (b.releaseDate || '').localeCompare(a.releaseDate || ''));
    return `<div class="serie" data-serie="${id}">
      <button data-toggle>
        <span class="name">${esc(g.name)}</span>
        <span class="meta">${sets.length}</span>
      </button>
      <div class="sets">${sets.map(s => `
        <button data-set="${esc(s.id)}">
          <span>${esc(s.name)}</span>
          <span class="id">${(s.releaseDate || '').slice(0, 4)}</span>
        </button>`).join('')}</div>
    </div>`;
  }).join('');
}

async function openSet(id) {
  document.querySelectorAll('.sets button').forEach(b => b.classList.toggle('active', b.dataset.set === id));
  document.querySelector(`.sets button[data-set="${CSS.escape(id)}"]`)?.closest('.serie')?.classList.add('open');
  state.current = id;
  $('#view').innerHTML = `<div class="empty">Loading ${esc(id)}…</div>`;

  let doc = state.cache.get(id);
  if (!doc) {
    try {
      doc = await (await fetch(SET(id), { cache: 'no-store' })).json();
      state.cache.set(id, doc);
    } catch (e) {
      $('#view').innerHTML = `<div class="empty">No <code>catalog/sets/${esc(id)}.json</code> on disk yet.<br><br>
        Either the pull has not reached it, or it failed. Both are worth knowing.</div>`;
      return;
    }
  }
  renderSet(doc);
}

function renderSet(doc) {
  const cards = doc.cards ?? [];
  const withArt = cards.filter(c => c.image).length;
  const filled = cards.filter(c => !c.image && c.imageAlt).length;
  const holes = cards.filter(c => !c.image && !c.imageAlt).length;
  const total = doc.cardCount?.total ?? 0;
  const official = doc.cardCount?.official ?? 0;
  const short = total && cards.length < total;

  const q = $('#q').value.trim().toLowerCase();
  const only = $('#holesOnly').checked;
  const shown = cards.filter(c => {
    if (only && (c.image || c.imageAlt)) return false;
    if (!q) return true;
    return (c.name ?? '').toLowerCase().includes(q) || String(c.localId ?? '').toLowerCase().includes(q);
  });

  $('#view').innerHTML = `
    <div class="sethead">
      ${doc.logo ? `<img src="${logo(doc.logo)}" alt="">` : ''}
      <div>
        <h2>${esc(doc.name)} <span style="color:var(--ink3);font-weight:400">${esc(doc.id)}</span></h2>
        <div class="sub">${esc(doc.serie?.name ?? '')} · ${doc.releaseDate ?? 'undated'}</div>
      </div>
      <div class="badges">
        <span class="badge">${cards.length} on disk</span>
        ${total ? `<span class="badge ${short ? 'bad' : 'ok'}">${total} listed upstream</span>` : ''}
        ${official ? `<span class="badge">${official} printed</span>` : ''}
        <span class="badge ok">${withArt} with art</span>
        ${filled ? `<span class="badge alt">${filled} filled</span>` : ''}
        ${holes ? `<span class="badge bad">${holes} no art</span>` : ''}
      </div>
    </div>
    ${short ? `<div class="badge bad" style="margin-bottom:12px;display:inline-block">
      This pull is short ${total - cards.length} cards — audit.py would call that incomplete-pull, not a hole.</div>` : ''}
    ${shown.length ? `<div class="grid">${shown.map(cardTile).join('')}</div>`
                   : `<div class="empty">No cards match.</div>`}`;
}

function cardTile(c) {
  const src = c.image ? thumb(c.image) : (c.imageAlt ?? null);
  const flag = c.image ? '' : (c.imageAlt
    ? `<span class="flag alt">${esc(c.imageAltSource ?? 'alt')}</span>`
    : `<span class="flag bad">no art</span>`);
  return `<div class="card" data-card="${esc(c.id)}">
    <div class="thumb">
      ${src ? `<img loading="lazy" src="${src}" alt="${esc(c.name)}"
                   onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'none',textContent:'image failed to load'}))">`
            : `<div class="none">no artwork<br>anywhere</div>`}
      ${flag}
    </div>
    <div class="cap">
      <span class="t">${esc(c.name ?? '—')}</span>
      <span class="n">${esc(String(c.localId ?? '?'))} · ${esc(c.rarity ?? 'no rarity')}</span>
    </div>
  </div>`;
}

function showCard(id) {
  const doc = state.cache.get(state.current);
  const c = (doc.cards ?? []).find(x => x.id === id);
  if (!c) return;
  const src = c.image ? full(c.image) : (c.imageAlt ?? null);
  $('#dlgBody').innerHTML = `
    <div class="art">
      ${src ? `<img src="${src}" alt="">` : `<div class="none" style="padding:60px 10px;text-align:center;color:var(--ink3)">no artwork anywhere</div>`}
      <div class="links" style="margin-top:10px">
        ${c.image ? `<div><a href="${full(c.image)}" target="_blank">TCGdex high.png</a></div>` : ''}
        ${c.imageAlt ? `<div><a href="${c.imageAlt}" target="_blank">${esc(c.imageAltSource ?? 'alt')} image</a></div>` : ''}
      </div>
    </div>
    <div class="body">
      <h3>${esc(c.name ?? '—')}</h3>
      <div class="sub">${esc(c.id)} · ${esc(String(c.localId ?? '?'))} · ${esc(c.rarity ?? 'no rarity')}</div>
      <pre>${esc(JSON.stringify(c, null, 2))}</pre>
    </div>`;
  $('#dlg').showModal();
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
}

// One listener per surface rather than an attribute per element: ids in this catalog
// are not all well-behaved, and none of them should ever reach an HTML attribute parser.
$('#nav').addEventListener('click', (e) => {
  const toggle = e.target.closest('[data-toggle]');
  if (toggle) { toggle.parentElement.classList.toggle('open'); return; }
  const setBtn = e.target.closest('[data-set]');
  if (setBtn) openSet(setBtn.dataset.set);
});
$('#view').addEventListener('click', (e) => {
  const card = e.target.closest('[data-card]');
  if (card) showCard(card.dataset.card);
});
$('#dlgClose').addEventListener('click', () => $('#dlg').close());

$('#q').addEventListener('input', () => state.current && renderSet(state.cache.get(state.current)));
$('#holesOnly').addEventListener('change', () => state.current && renderSet(state.cache.get(state.current)));
$('#reload').addEventListener('click', () => {
  // The catalog is being rebuilt while this is open, so a reload has to actually re-read
  // rather than replay what was cached a pull ago.
  state.cache.clear();
  boot().then(() => state.current && openSet(state.current));
});

boot();
</script>
</body>
</html>
